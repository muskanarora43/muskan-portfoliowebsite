<!DOCTYPE html>
<html>
<head>
    <title>Muskan Arora | Portfolio</title>
  <style>
      html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      line-height: 1.6;
    }

    nav {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      text-align: center;
    }

    nav a {
      margin: 0 15px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    header {
      text-align: center;
      padding: 80px 20px;
    }

    header p {
      margin-top: 10px;
      font-size: 15px;
    }
       /* LINK COLORS */
    header a {
      text-decoration: none;
      font-weight: 500;
      margin: 0 5px;
    }

    header a[href*="linkedin"] {
      color: #0A66C2;
    }

    header a[href*="github"] {
      color: #e5e7eb;
    }

    header a[href^="mailto"] {
      color: #38bdf8;
    }

    header a:hover {
      opacity: 0.7;
    }

    h1 {
      font-size: 50px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      color: transparent;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 26px;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .card {
      background: #1e293b;
      padding: 22px;
      border-radius: 12px;
      margin-top: 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .card.highlight {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56,189,248,0.4);
    }

    ul {
      padding-left: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      border-radius: 8px;
      background: #38bdf8;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: gray;
    }
      /* BITMOJI HEADER */
.header-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 15px rgba(56,189,248,0.6);
  transition: 0.3s;
}

.avatar:hover {
  transform: scale(1.05);
}
// new CCS
    /* Background glow effect */
body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(56,189,248,0.12), transparent 70%);
  top: -150px;
  left: -150px;
  z-index: -1;
}

/* Optional second glow (bottom right) */
body::after {
  content: "";
  position: fixed;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(129,140,248,0.1), transparent 70%);
  bottom: -150px;
  right: -150px;
  z-index: -1;
}

    .phone {
  color: #e5e7eb !important;
  text-decoration: none;
  font-weight: 500;
}

/* Mobile override fix */
a[href^="tel"] {
  color: #e5e7eb !important;
  text-decoration: none;
}

  </style>
</head>
    <body>

        <canvas id="bgCanvas"></canvas>
    <div id="scrollBar"></div>
    
    
   <div class="nav-panel">
    <a href="#about">About</a>
    <a href="#experience">Experience</a>
    <a href="#projects">Projects</a>
    <a href="#skills">Skills</a>
    <a href="#education">Education</a>
</div>
       
    </body>
